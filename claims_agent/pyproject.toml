[project]
name = "harborview-claims-agent"
version = "0.1.0"
description = "LangGraph agent on the Agent Bricks durable runtime for Databricks Apps"
readme = "README.md"
authors = [
    { name = "Agent Developer", email = "developer@example.com" }
]
requires-python = ">=3.11"
dependencies = [
    # Agent Bricks includes the HTTP runtime; this extra adds the langgraph framework adapter.
    "databricks-agentbricks[langgraph]>=0.8.0",
    "databricks-langchain==0.21.0",
    "mcp<2",  # langchain-mcp-adapters 0.3.x uses the MCP 1.x API.
    "uvicorn>=0.41.0",
    "python-dotenv>=1.2.1",
    "databricks-sdk>=0.124.0",
    "databricks-agents>=1.9.3",
    "mlflow[databricks]>=3.9",
    # The app runtime ignores uv.lock and re-resolves on every restart. pyarrow 26 needs NumPy 2 (this env resolves 1.26),
    # which breaks the databricks-connect import, so UCFunctionToolkit gets no default client and every request fails.
    "pyarrow>=14,<26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "runtime"]


[dependency-groups]
dev = [
    "hatchling>=1.28.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[project.scripts]
start-server = "runtime.main:main"
